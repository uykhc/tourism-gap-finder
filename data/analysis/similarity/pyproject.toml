[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hankkeut-tourism-similarity"
version = "0.1.0"
description = "韓끗 — 구조 특성 기반 시군구 유사 지역 탐색"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "lxml>=5.0",
]

[project.scripts]
hankkeut-similarity = "hankkeut_similarity.main:main"
hankkeut-similarity-collect = "hankkeut_similarity.collect:main"
hankkeut-similarity-build-climate = "hankkeut_similarity.climate:main"
hankkeut-similarity-build-terrain = "hankkeut_similarity.terrain:main"
hankkeut-similarity-build-land-cover = "hankkeut_similarity.land_cover:main"
hankkeut-similarity-groups = "hankkeut_similarity.legacy.similarity_cli:main"

[project.optional-dependencies]
geospatial = ["rasterio>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]
