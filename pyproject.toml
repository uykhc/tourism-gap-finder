[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-gap-finder"
version = "0.1.0"
description = "TourAPI 기반 시군구 관광자원 포트폴리오 분석기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0", "pwdlib[argon2]>=0.2,<1.0", "PyJWT>=2.8,<3.0", "email-validator>=2.0,<3.0"]
ai = ["openai>=1.0,<3.0"]
