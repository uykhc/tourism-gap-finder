[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-gap-finder"
version = "0.1.0"
description = "TourAPI 기반 시군구 관광자원 포트폴리오 분석기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0", "pwdlib[argon2]>=0.2,<1.0", "PyJWT>=2.8,<3.0", "email-validator>=2.0,<3.0"]

[project.scripts]
hankkeut-portfolio = "hankkeut_analysis.gap_analyzer.cli:main"
hankkeut-hubs = "hankkeut_analysis.gap_analyzer.hub_cli:main"
hankkeut-stay = "hankkeut_analysis.gap_analyzer.stay_cli:main"
hankkeut-benchmark = "hankkeut_analysis.gap_analyzer.benchmark_cli:main"
hankkeut-discover = "hankkeut_analysis.gap_analyzer.discovery_cli:main"
hankkeut-portfolio-benchmark = "hankkeut_analysis.gap_analyzer.portfolio_benchmark_cli:main"
hankkeut-visitor-portfolio = "hankkeut_analysis.performance_evaluator.visitor_portfolio_benchmark:main"
hankkeut-similarity-groups = "hankkeut_analysis.peer_finder.similarity_cli:main"
hankkeut-kakao-places = "hankkeut_analysis.kakao_places.cli:main"
hankkeut-kakao-regions = "hankkeut_analysis.kakao_places.region_cli:main"
hankkeut-build-gyeonggi-boundaries = "hankkeut_analysis.kakao_places.boundary_builder:main"
hankkeut-kakao-tourism-content = "hankkeut_analysis.kakao_places.tourism_cli:main"

[tool.setuptools]
package-dir = {"" = "packages/analysis"}

[tool.setuptools.packages.find]
where = ["packages/analysis"]
