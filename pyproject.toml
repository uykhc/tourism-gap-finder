[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-gap-finder"
version = "0.1.0"
description = "TourAPI 기반 시군구 관광자원 포트폴리오 분석기"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "pwdlib[argon2]>=0.2,<1.0", "PyJWT>=2.8,<3.0", "email-validator>=2.0,<3.0"]
ai = ["openai>=1.0,<3.0"]
# httpx is what fastapi.testclient.TestClient imports; without it no endpoint
# test can run at all.
dev = ["httpx>=0.27,<1.0", "pytest>=8,<9"]

# 이 저장소는 apps/, data/, config/ 등을 함께 두는 모노레포다. setuptools의
# 자동 탐색을 그대로 쓰면 이 디렉터리들을 모두 배포 패키지로 간주해 editable
# 설치가 실패한다. 루트 배포물에는 FastAPI 애플리케이션 패키지만 포함한다.
[tool.setuptools.packages.find]
include = ["apps.api.app*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["."]
